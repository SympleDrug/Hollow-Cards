<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Hollow Cards</title>
  <style>
    body { margin: 0; background: #0a0a0a; display: flex;
           justify-content: center; align-items: center;
           height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    canvas { background: #1a1a1a; border: 2px solid #333; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(241, 196, 15, 0.2); }
  </style>
</head>
<body>
  <canvas id="game" width="500" height="760"></canvas>

  <!-- Музыка -->
  <audio id="bgMusic" src="rogue_tactics_ambient_loop.wav" loop preload="auto"></audio>
  <audio id="bossMusic" src="rogue_tactics_boss_battle.wav" loop preload="auto"></audio>
  
  <!-- Звуковые эффекты -->
  <audio id="sfxClick" src="click.wav" preload="auto"></audio>
  <audio id="sfxSword" src="sword_swing.wav" preload="auto"></audio>
  <audio id="sfxHit" src="hit.wav" preload="auto"></audio>
  <audio id="sfxVictory" src="victory.wav" preload="auto"></audio>
  <audio id="sfxDeath" src="death.wav" preload="auto"></audio>
  <audio id="sfxMagic" src="dark_magic.wav" preload="auto"></audio>
  <audio id="sfxHeal" src="heal.wav" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- НАСТРОЙКИ ---
    let isMusicEnabled = true;
    let musicVolume = 0.5; 
    let graphicsQuality = 2; 

    // --- ЗВУКИ ---
    const bgMusic = document.getElementById('bgMusic');
    const bossMusic = document.getElementById('bossMusic');
    const sfxClick = document.getElementById('sfxClick');
    const sfxSword = document.getElementById('sfxSword');
    const sfxHit = document.getElementById('sfxHit');
    const sfxVictory = document.getElementById('sfxVictory');
    const sfxDeath = document.getElementById('sfxDeath');
    const sfxMagic = document.getElementById('sfxMagic');
    const sfxHeal = document.getElementById('sfxHeal');
    
    function updateMusicVolume() {
        if(bgMusic) bgMusic.volume = musicVolume * 0.56;
        if(bossMusic) bossMusic.volume = musicVolume * 0.7;
    }
    updateMusicVolume();

    function playSFX(sound, volume = 0.4) {
        if (!sound || !isMusicEnabled) return;
        sound.currentTime = 0; 
        sound.volume = volume;
        sound.play().catch(() => {});
    }

    // --- СОСТОЯНИЕ ИГРЫ ---
    let gameState = 'SPLASH'; 
    let splashTimer = 0;
    let particles = [];
    let mouseX = -1000, mouseY = -1000;
    let hasActiveRun = false;

    const GRID = 5, CELL = 100, OFFSET_Y = 110; 
    let level = 1, isBoss = false; 
    let hero, enemy, obstacles, enemyLastDir, deck, hand, discardPile;
    let energy, maxEnergy, selectedCardIndex, gameOver, gameWin;
    let isEnemyTurn, isVictoryTransition, cardPositions, floatingTexts;
    let isRewardScreen, rewardCards;

    // --- КАРТИНКИ ---
    const heroImg = new Image(); heroImg.src = 'characters/hero_02.png'; 
    const enemyImg = new Image(); enemyImg.src = 'characters/enemy_02.png';
    const bossImg = new Image(); bossImg.src = 'boss/boss_02.png';

    const heroAtkImg = new Image(); heroAtkImg.src = 'characters/hero_10.png'; 
    const enemyAtkImg = new Image(); enemyAtkImg.src = 'characters/enemy_10.png';
    const bossAtkImg = new Image(); bossAtkImg.src = 'boss/boss_14.png';

    // Картинки карт
    const imgCardAttack = new Image(); imgCardAttack.src = 'card_attack.png';
    const imgCardHeal = new Image(); imgCardHeal.src = 'card_heal.png';
    const imgCardMove = new Image(); imgCardMove.src = 'card_move.png';
    const imgCardRanged = new Image(); imgCardRanged.src = 'card_ranged.png';
    const imgCardJump = new Image(); imgCardJump.src = 'card_jump.png';

            const rewardPool = [
      { name: 'УДАР', type: 'attack', cost: 1, val: 3, desc: 'Удар по врагу рядом.' },
      { name: 'ШАГ', type: 'move', cost: 1, val: 1, desc: 'Шаг в любую сторону.' },
      { name: 'ПРЫЖОК', type: 'jump', cost: 1, val: 2, desc: 'Прыжок через стену.' },
      { name: 'ШАР', type: 'ranged', cost: 2, val: 4, desc: 'Магия на 2 клетки.' },
      { name: 'ХИЛКА', type: 'heal', cost: 1, val: 3, desc: 'Лечение героя.' }
    ];

    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1, speedX: (Math.random() - 0.5) * 0.5, speedY: (Math.random() - 0.5) * 0.5,
        alpha: Math.random() * 0.5 + 0.1
      });
    }

    function playMusic() { 
        if (!isMusicEnabled) return; 

        if (gameState === 'PLAYING' && isBoss) {
            if (bgMusic) { bgMusic.pause(); bgMusic.currentTime = 0; }
            if (bossMusic && bossMusic.paused) {
                bossMusic.play().catch(() => {});
            }
        } else {
            if (bossMusic) { bossMusic.pause(); bossMusic.currentTime = 0; }
            if (bgMusic && bgMusic.paused) {
                bgMusic.play().catch(() => {});
            }
        }
    }
    
    window.addEventListener('pointerdown', playMusic);
    window.addEventListener('keydown', playMusic);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
    });

    function initGameData() {
      if (bossMusic) { bossMusic.pause(); bossMusic.currentTime = 0; }
      if (bgMusic) { bgMusic.currentTime = 0; }
      if (sfxVictory) { sfxVictory.pause(); sfxVictory.currentTime = 0; }
      if (sfxDeath) { sfxDeath.pause(); sfxDeath.currentTime = 0; }

      hero = { col: 0, row: 4, hp: 10, maxHp: 10, color: '#4a9c6a', size: 30, flash: 0, isAttacking: false }; 
      enemy = { col: 4, row: 0, hp: 6, dmg: 1, size: 30, color: '#c0392b', flash: 0, isAttacking: false }; 
      obstacles = []; enemyLastDir = null; deck = []; hand = []; discardPile = [];
      energy = 3; maxEnergy = 3; selectedCardIndex = -1; gameOver = false; gameWin = false;
      isEnemyTurn = false; isVictoryTransition = false; isRewardScreen = false; floatingTexts = [];
      level = 1; isBoss = false;
      
      for(let i=0; i<3; i++) deck.push({ ...rewardPool[0] });
      for(let i=0; i<3; i++) deck.push({ ...rewardPool[1] });
      for(let i=0; i<2; i++) deck.push({ ...rewardPool[2] });
      for(let i=0; i<2; i++) deck.push({ ...rewardPool[3] });
      
      shuffle(deck); drawCards(4); generateLevel();
      playMusic();
    }

    function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }
    function drawCards(amount) { for (let i = 0; i < amount; i++) { if (deck.length === 0) { deck = [...discardPile]; discardPile = []; shuffle(deck); } if (deck.length > 0) hand.push(deck.pop()); } }

    function canReach(startC, startR, targetC, targetR) {
      let queue = [{ col: startC, row: startR }]; let visited = new Set(); visited.add(`${startC},${startR}`);
      while (queue.length > 0) {
        let current = queue.shift();
        if (current.col === targetC && current.row === targetR) return true;
        const dirs = [{c: 0, r: -1}, {c: 0, r: 1}, {c: -1, r: 0}, {c: 1, r: 0}];
        for (let d of dirs) {
          let nc = current.col + d.c; let nr = current.row + d.r; let key = `${nc},${nr}`;
          if (nc >= 0 && nc < GRID && nr >= 0 && nr < GRID && !visited.has(key) && !isObstacle(nc, nr)) {
            visited.add(key); queue.push({ col: nc, row: nr });
          }
        }
      }
      return false; 
    }

    function generateLevel() {
      obstacles = []; let numObstacles = 3 + Math.floor(level / 2); let attempts = 0;
      while (obstacles.length < numObstacles && attempts < 100) {
        attempts++; let c = Math.floor(Math.random() * GRID); let r = Math.floor(Math.random() * GRID);
        let isHero = (c === hero.col && r === hero.row); let isEnemy = (c === enemy.col && r === enemy.row); let isExist = obstacles.some(o => o.col === c && o.row === r);
        if (!isHero && !isEnemy && !isExist) { obstacles.push({ col: c, row: r }); if (!canReach(hero.col, hero.row, enemy.col, enemy.row)) obstacles.pop(); }
      }
    }

    function isObstacle(c, r) { return obstacles.some(o => o.col === c && o.row === r); }
    function addFloatingText(col, row, text, color) { floatingTexts.push({ col, row, text, color, alpha: 1, yOffset: 0 }); }

    function endPlayerTurn() { 
        if (isEnemyTurn || gameOver || gameWin || isRewardScreen) return; 
        playSFX(sfxClick);
        discardPile.push(...hand); hand = []; selectedCardIndex = -1; isEnemyTurn = true; setTimeout(enemyTurn, 400); 
    }
    function startPlayerTurn() { energy = maxEnergy; drawCards(4); isEnemyTurn = false; }

    function handleVictory() {
      isVictoryTransition = true; 
      setTimeout(() => {
        if (level === 5) { gameWin = true; isVictoryTransition = false; hasActiveRun = false; playSFX(sfxVictory); return; }
        isVictoryTransition = false; isRewardScreen = true; rewardCards = [];
        for (let i = 0; i < 3; i++) rewardCards.push({ ...rewardPool[Math.floor(Math.random() * rewardPool.length)] });
      }, 1000); 
    }

    function startNextLevel() {
      level++; hero.hp = Math.min(hero.hp + 3, hero.maxHp); hero.col = 0; hero.row = 4; hero.flash = 0; hero.isAttacking = false;
      enemy.col = 4; enemy.row = 0; enemy.flash = 0; enemy.isAttacking = false;
      
      if (level === 5) { isBoss = true; enemy.hp = 50; enemy.dmg = 3; enemy.size = 40; enemy.color = '#8e44ad'; } 
      else { isBoss = false; enemy.hp = 6 + (level - 1) * 4; enemy.dmg = (level >= 3) ? 2 : 1; enemy.size = 30; enemy.color = (level >= 3) ? '#e74c3c' : '#c0392b'; }
      
      discardPile.push(...hand); hand = []; selectedCardIndex = -1; enemyLastDir = null; isRewardScreen = false; floatingTexts = []; generateLevel(); startPlayerTurn(); 
      playMusic(); 
    }

    function getEnemyNextStep(startC, startR, targetC, targetR) {
      let queue = [{ col: startC, row: startR, path: [] }]; let visited = new Set(); visited.add(`${startC},${startR}`);
      while (queue.length > 0) {
        let current = queue.shift(); let dist = Math.abs(current.col - targetC) + Math.abs(current.row - targetR);
        if (dist === 1) { if (current.path.length > 0) return current.path[0]; return { col: current.col, row: current.row }; }
        const dirs = [{c: 0, r: -1}, {c: 0, r: 1}, {c: -1, r: 0}, {c: 1, r: 0}];
        for (let d of dirs) {
          let nc = current.col + d.c; let nr = current.row + d.r; let key = `${nc},${nr}`;
          if (nc >= 0 && nc < GRID && nr >= 0 && nr < GRID && !visited.has(key) && !isObstacle(nc, nr) && !(nc === targetC && nr === targetR)) {
            visited.add(key); queue.push({ col: nc, row: nr, path: [...current.path, { col: nc, row: nr }] });
          }
        }
      }
      return null; 
    }

    function enemyTurn() {
      if (gameOver || gameWin) return;
      const dist = Math.abs(hero.col - enemy.col) + Math.abs(hero.row - enemy.row);
      
      if (dist === 1) {
        playSFX(sfxHit); 
        hero.hp -= enemy.dmg; hero.flash = 10; addFloatingText(hero.col, hero.row, '-' + enemy.dmg, '#e74c3c'); 
        enemy.isAttacking = true; setTimeout(() => { enemy.isAttacking = false; }, 300);
        if (hero.hp <= 0) { hero.hp = 0; gameOver = true; hasActiveRun = false; playSFX(sfxDeath); }
        isEnemyTurn = false; if(!gameOver) setTimeout(startPlayerTurn, 300); return;
      }
      
      let steps = (isBoss && dist > 2) ? 2 : 1;
      for(let s = 0; s < steps; s++) {
          let dx = hero.col - enemy.col; let dy = hero.row - enemy.row;
          let moveX = dx > 0 ? 1 : -1; let moveY = dy > 0 ? 1 : -1; let opts = [];
          if (dx !== 0 && !isObstacle(enemy.col + moveX, enemy.row)) opts.push({ c: moveX, r: 0, axis: 'x' });
          if (dy !== 0 && !isObstacle(enemy.col, enemy.row + moveY)) opts.push({ c: 0, r: moveY, axis: 'y' });
          let chosen = null;
          if (opts.length > 0) { chosen = opts.find(o => o.axis !== enemyLastDir); if (!chosen) chosen = opts[0]; }
          if (chosen) { enemy.col += chosen.c; enemy.row += chosen.r; enemyLastDir = chosen.axis; } 
          else {
            let pathStep = getEnemyNextStep(enemy.col, enemy.row, hero.col, hero.row);
            if (pathStep) { if (pathStep.col !== enemy.col) enemyLastDir = 'x'; if (pathStep.row !== enemy.row) enemyLastDir = 'y'; enemy.col = pathStep.col; enemy.row = pathStep.row; } 
            else if (isBoss) {
               let breakDir = [{c: 0, r: -1}, {c: 0, r: 1}, {c: -1, r: 0}, {c: 1, r: 0}];
               for(let bd of breakDir) { let bc = enemy.col + bd.c; let br = enemy.row + bd.r;
                   if (bc >= 0 && bc < GRID && br >= 0 && br < GRID && isObstacle(bc, br)) { obstacles = obstacles.filter(o => !(o.col === bc && o.row === br)); addFloatingText(bc, br, 'КРАК!', '#f39c12'); break; }
               }
            }
          }
          if (Math.abs(hero.col - enemy.col) + Math.abs(hero.row - enemy.row) === 1) break;
      }
      isEnemyTurn = false; setTimeout(startPlayerTurn, 300);
    }

    // --- ОБРАБОТКА КЛИКОВ ---
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;

      if (gameState === 'SPLASH') { if (splashTimer > 60) { gameState = 'MENU'; } return; }
      
      if (gameState === 'MENU') {
        const checkBtn = (bx, by, bw, bh) => x > bx && x < bx + bw && y > by && y < by + bh;
        if (checkBtn(100, 380, 300, 50)) { playSFX(sfxClick); initGameData(); hasActiveRun = true; gameState = 'PLAYING'; }
        if (checkBtn(100, 450, 300, 50) && hasActiveRun) { playSFX(sfxClick); gameState = 'PLAYING'; }
        if (checkBtn(100, 520, 300, 50)) { playSFX(sfxClick); gameState = 'SETTINGS'; }
        if (checkBtn(100, 590, 300, 50)) { playSFX(sfxClick); gameState = 'TUTORIAL'; }
        if (checkBtn(100, 660, 300, 50)) { playSFX(sfxClick); gameState = 'EXIT'; }
        return;
      }

      if (gameState === 'SETTINGS') {
        if (x > 150 && x < 350 && y > 680 && y < 730) { playSFX(sfxClick); gameState = 'MENU'; return; } 
        if (y > 200 && y < 240) {
            if (x > 20 && x < 120) { playSFX(sfxClick); graphicsQuality = 0; return; }
            if (x > 135 && x < 235) { playSFX(sfxClick); graphicsQuality = 1; return; }
            if (x > 250 && x < 350) { playSFX(sfxClick); graphicsQuality = 2; return; }
            if (x > 365 && x < 480) { playSFX(sfxClick); graphicsQuality = 3; return; }
        }
        if (y > 320 && y < 370) {
            if (x > 100 && x < 140) { playSFX(sfxClick); musicVolume = Math.max(0, musicVolume - 0.1); updateMusicVolume(); return; }
            if (x > 360 && x < 400) { playSFX(sfxClick); musicVolume = Math.min(1, musicVolume + 0.1); updateMusicVolume(); return; }
        }
        if (x > 150 && x < 350 && y > 450 && y < 500) {
          isMusicEnabled = !isMusicEnabled;
          if(isMusicEnabled) { playMusic(); } else { if(bgMusic) bgMusic.pause(); if(bossMusic) bossMusic.pause(); }
          playSFX(sfxClick); return;
        }
        return;
      }

      if (gameState === 'TUTORIAL' || gameState === 'EXIT') {
        if (x > 150 && x < 350 && y > 680 && y < 730) { playSFX(sfxClick); gameState = 'MENU'; } 
        return;
      }

      if (gameState === 'PLAYING') {
        if (gameOver || gameWin) { playSFX(sfxClick); initGameData(); return; }
        if (isEnemyTurn || isVictoryTransition) return; 
        if (x > 400 && x < 480 && y > 10 && y < 40) { playSFX(sfxClick); gameState = 'MENU'; return; }

        // ЭКРАН НАГРАД
        if (isRewardScreen) {
          for (let i = 0; i < 3; i++) {
            let cx = 55 + i * 135; 
            let cy = 250;
            if (x > cx && x < cx + 90 && y > cy && y < cy + 135) { 
                playSFX(sfxClick); 
                deck.push(rewardCards[i]); 
                startNextLevel(); return; 
            }
          }
          return;
        }

        if (x > 150 && x < 350 && y > 60 && y < 95) { endPlayerTurn(); return; }

        // КЛИК ПО КАРТАМ
        for (let i = 0; i < cardPositions.length; i++) {
          let pos = cardPositions[i];
          if (x > pos.x && x < pos.x + pos.w && y > pos.y && y < pos.y + pos.h) {
            if (energy >= hand[i].cost) { 
                playSFX(sfxClick); 
                selectedCardIndex = (selectedCardIndex === i) ? -1 : i; 
                return; 
            }
          }
        }

        // КЛИК ПО СЕТКЕ
        const col = Math.floor(x / CELL); const row = Math.floor((y - OFFSET_Y) / CELL);
        if (col >= 0 && col < GRID && row >= 0 && row < GRID && selectedCardIndex !== -1) {
          let card = hand[selectedCardIndex]; let actionMade = false;
          let dx = Math.abs(hero.col - col); let dy = Math.abs(hero.row - row);

          if (card.type === 'attack' && col === enemy.col && row === enemy.row && dx <= 1 && dy <= 1 && (dx + dy > 0)) { 
              playSFX(sfxSword); enemy.hp -= card.val; enemy.flash = 10; addFloatingText(enemy.col, enemy.row, '-' + card.val, '#e74c3c'); 
              hero.isAttacking = true; setTimeout(() => { hero.isAttacking = false; }, 300); actionMade = true;
          } else if (card.type === 'ranged' && col === enemy.col && row === enemy.row && Math.max(dx, dy) <= 2) {
              playSFX(sfxMagic); enemy.hp -= card.val; enemy.flash = 10; addFloatingText(enemy.col, enemy.row, '-' + card.val, '#e74c3c'); 
              hero.isAttacking = true; setTimeout(() => { hero.isAttacking = false; }, 300); actionMade = true;
          } else if (card.type === 'move' && !isObstacle(col, row) && !(col === hero.col && row === hero.row) && !(col === enemy.col && row === enemy.row) && dx <= 1 && dy <= 1) { 
              playSFX(sfxClick); hero.col = col; hero.row = row; actionMade = true;
          } else if (card.type === 'jump' && !isObstacle(col, row) && !(col === hero.col && row === hero.row) && !(col === enemy.col && row === enemy.row) && dx <= 2 && dy <= 2) {
              playSFX(sfxClick); hero.col = col; hero.row = row; actionMade = true;
          } else if (card.type === 'heal' && col === hero.col && row === hero.row) {
              playSFX(sfxHeal); let healAmount = Math.min(card.val, hero.maxHp - hero.hp); hero.hp += healAmount;
              if(healAmount > 0) addFloatingText(hero.col, hero.row, '+' + healAmount, '#2ecc71'); actionMade = true;
          }
          if (actionMade) {
            energy -= card.cost; discardPile.push(card); hand.splice(selectedCardIndex, 1); selectedCardIndex = -1;
            if (enemy.hp <= 0) handleVictory();
          }
        }
      }
    });

    // --- ФУНКЦИИ ОТРИСОВКИ ---
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawButton(x, y, w, h, text, isActive = true) {
      let isHover = mouseX > x && mouseX < x + w && mouseY > y && mouseY < y + h && isActive;
      ctx.fillStyle = isHover ? '#e67e22' : (isActive ? '#2c3e50' : '#1a1a1a');
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = isHover ? '#fff' : (isActive ? '#7f8c8d' : '#333');
      ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
      
      ctx.fillStyle = isActive ? (isHover ? '#fff' : '#ddd') : '#555';
      ctx.font = 'bold 16px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2, w - 10);
    }

    function drawToggleButton(x, y, w, h, text, isActive) {
      ctx.fillStyle = isActive ? '#c0392b' : '#2c3e50';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = isActive ? '#fff' : '#7f8c8d';
      ctx.lineWidth = isActive ? 3 : 2; ctx.strokeRect(x, y, w, h);
      
      ctx.fillStyle = isActive ? '#fff' : '#aaa';
      ctx.font = 'bold 14px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2, w - 10);
    }

    function drawParticles() {
      if (graphicsQuality < 2) return; 
      particles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
        ctx.fillStyle = `rgba(241, 196, 15, ${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawEntity(entity, isBoss) {
      const centerX = entity.col * CELL + CELL / 2;
      const centerY = entity.row * CELL + CELL / 2 + OFFSET_Y;
      
      if (graphicsQuality === 0) {
          ctx.beginPath(); ctx.arc(centerX, centerY, entity.size || 30, 0, Math.PI * 2);
          ctx.fillStyle = entity.color; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();
          ctx.fillStyle = 'white'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(entity.hp, centerX, centerY);
          return;
      }

      let imgToDraw;
      if (entity === hero) imgToDraw = entity.isAttacking ? heroAtkImg : heroImg;
      else if (entity === enemy) imgToDraw = isBoss ? (entity.isAttacking ? bossAtkImg : bossImg) : (entity.isAttacking ? enemyAtkImg : enemyImg);

      let drawHeight = isBoss ? 95 : 75; 
      let drawWidth = drawHeight; 

      if (imgToDraw && imgToDraw.complete && imgToDraw.naturalWidth > 0) {
          drawWidth = imgToDraw.width * (drawHeight / imgToDraw.height);

          if (entity.flash > 0) { ctx.globalAlpha = 0.5; entity.flash--; }

          if (graphicsQuality >= 3) {
              ctx.shadowColor = isBoss ? '#ff0000' : (entity === hero ? '#00ff00' : '#ff4444');
              ctx.shadowBlur = 15;
          }

          ctx.drawImage(imgToDraw, centerX - drawWidth / 2, centerY - drawHeight / 2, drawWidth, drawHeight);
          
          ctx.shadowBlur = 0; ctx.globalAlpha = 1; 
      } else {
          ctx.beginPath(); ctx.arc(centerX, centerY, entity.size || 30, 0, Math.PI * 2);
          ctx.fillStyle = entity.color; ctx.fill();
      }

      ctx.fillStyle = 'white'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
      let hpText = (entity === hero) ? (entity.hp + '/' + entity.maxHp) : (entity.hp + ' HP');
      let textY = centerY + (drawHeight / 2) - 5;
      ctx.strokeText(hpText, centerX, textY); ctx.fillText(hpText, centerX, textY);
    }

    function drawCardUI(x, y, card, isSelected, w = 90, h = 130) {
      let imgToDraw;
      if (card.type === 'attack') imgToDraw = imgCardAttack;
      else if (card.type === 'heal') imgToDraw = imgCardHeal;
      else if (card.type === 'move') imgToDraw = imgCardMove;
      else if (card.type === 'ranged') imgToDraw = imgCardRanged;
      else if (card.type === 'jump') imgToDraw = imgCardJump;

      // Тень / Золотая подсветка
      if (isSelected) {
          ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 20;
          ctx.fillStyle = '#f1c40f'; 
          roundRect(ctx, x - 2, y - 2, w + 4, h + 4, 8);
          ctx.fill();
          ctx.shadowBlur = 0; 
      } else {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.7)'; ctx.shadowBlur = 6;
          ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 4;
          ctx.fillStyle = 'black';
          roundRect(ctx, x, y, w, h, 8);
          ctx.fill();
      }
      
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

      // Сама картинка карты
      if (imgToDraw && imgToDraw.complete && imgToDraw.naturalWidth > 0) {
          ctx.drawImage(imgToDraw, x, y, w, h);
      } else {
          ctx.fillStyle = '#333';
          roundRect(ctx, x, y, w, h, 8); ctx.fill();
      }

      // Панель с текстом снизу
      const panelH = 35;
      ctx.fillStyle = '#141a1f'; 
      ctx.beginPath();
      ctx.moveTo(x, y + h - panelH);
      ctx.lineTo(x + w, y + h - panelH);
      ctx.lineTo(x + w, y + h - 8);
      ctx.quadraticCurveTo(x + w, y + h, x + w - 8, y + h);
      ctx.lineTo(x + 8, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - 8);
      ctx.closePath();
      ctx.fill();

      // Цветная полоска над панелью
      ctx.fillStyle = card.color || '#f1c40f';
      ctx.fillRect(x, y + h - panelH, w, 2);

      // Текст на панели (Цифра и подпись)
      ctx.textBaseline = 'middle';
      
      // Значение
      ctx.fillStyle = card.color || '#f1c40f';
      ctx.font = 'bold 16px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.val, x + w/2 - 10, y + h - 22);
      
      // Подпись значения
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';
      let lbl = "УРОН"; if (card.type==='heal') lbl="ЗДОР."; if(card.type==='move'||card.type==='jump') lbl="КЛЕТ.";
      ctx.fillText(lbl, x + w/2 + 2, y + h - 22);

      // Описание
      ctx.fillStyle = '#bdc3c7';
      ctx.font = '9px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.desc, x + w/2, y + h - 9);

      // Рамка при выборе
      if (isSelected) {
          ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
          roundRect(ctx, x, y, w, h, 8); ctx.stroke();
      }
    }
    // --- ГЛАВНЫЙ ЦИКЛ ---
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === 'SPLASH') {
        splashTimer++;
        let alpha = 0;
        if (splashTimer < 30) alpha = splashTimer / 30; 
        else if (splashTimer < 120) alpha = 1; 
        else if (splashTimer < 150) alpha = 1 - (splashTimer - 120) / 30; 
        else { gameState = 'MENU'; requestAnimationFrame(gameLoop); return; }

        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = alpha; ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 32px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('OdessGameTactics', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 50px "Segoe UI", sans-serif';
        ctx.fillText('HOLLOW CARDS', canvas.width / 2, canvas.height / 2 + 30);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        requestAnimationFrame(gameLoop); return;
      }

      if (gameState === 'MENU') {
        let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 500);
        grad.addColorStop(0, '#1a1a2e'); grad.addColorStop(1, '#0a0a0a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawParticles();

        ctx.shadowColor = '#e67e22'; ctx.shadowBlur = 15;
        ctx.fillStyle = '#f39c12'; ctx.font = 'bold 46px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('HOLLOW', canvas.width / 2, 100);
        ctx.fillStyle = '#c0392b'; ctx.fillText('CARDS', canvas.width / 2, 150);
        ctx.shadowBlur = 0;

        ctx.save(); ctx.translate(canvas.width / 2, 250);
        ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(45, -20); ctx.lineTo(45, 35); ctx.lineTo(0, 80); ctx.lineTo(-45, 35); ctx.lineTo(-45, -20); ctx.closePath();
        ctx.fillStyle = '#2c3e50'; ctx.fill(); ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, 60); ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(15, 0); ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 5; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 65, 7, 0, Math.PI * 2); ctx.fillStyle = '#f1c40f'; ctx.fill();
        ctx.restore();

        drawButton(100, 380, 300, 50, 'НАЧАТЬ ИГРУ', true);
        drawButton(100, 450, 300, 50, 'ПРОДОЛЖИТЬ', hasActiveRun);
        drawButton(100, 520, 300, 50, 'НАСТРОЙКИ', true);
        drawButton(100, 590, 300, 50, 'ОБУЧЕНИЕ', true);
        drawButton(100, 660, 300, 50, 'ВЫХОД', true);
        requestAnimationFrame(gameLoop); return;
      }

      if (gameState === 'SETTINGS') {
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawParticles();
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
        ctx.shadowColor = '#e67e22'; ctx.shadowBlur = 10; ctx.fillText('НАСТРОЙКИ', canvas.width / 2, 80); ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('ГРАФИКА:', 20, 170);
        drawToggleButton(20, 200, 100, 40, 'НИЗКАЯ', graphicsQuality === 0);
        drawToggleButton(135, 200, 100, 40, 'СРЕДНЯЯ', graphicsQuality === 1);
        drawToggleButton(250, 200, 100, 40, 'ВЫСОКАЯ', graphicsQuality === 2);
        drawToggleButton(365, 200, 115, 40, 'УЛЬТРА', graphicsQuality === 3);

        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('ГРОМКОСТЬ МУЗЫКИ:', 20, 290);
        drawButton(100, 320, 40, 50, '-', musicVolume > 0);
        drawButton(360, 320, 40, 50, '+', musicVolume < 1);
        
        ctx.fillStyle = '#333'; ctx.fillRect(150, 335, 200, 20);
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(150, 335, 200 * musicVolume, 20);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(150, 335, 200, 20);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Math.round(musicVolume * 100) + '%', 250, 380);

        drawButton(150, 450, 200, 50, isMusicEnabled ? 'ЗВУК: ВКЛ' : 'ЗВУК: ВЫКЛ', true); 
        drawButton(150, 680, 200, 50, 'НАЗАД', true);
        requestAnimationFrame(gameLoop); return;
      }

      if (gameState === 'TUTORIAL') {
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height); drawParticles();
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 36px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#e67e22'; ctx.shadowBlur = 10;
        ctx.fillText('ОБУЧЕНИЕ', canvas.width / 2, 70); ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(44, 62, 80, 0.7)'; ctx.fillRect(40, 120, 420, 520);
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(40, 120, 420, 520);

        ctx.fillStyle = '#e67e22'; ctx.font = 'bold 18px "Segoe UI", sans-serif'; ctx.textAlign = 'left'; ctx.fillText('🎯 ЦЕЛЬ:', 60, 160);
        ctx.fillStyle = '#eee'; ctx.font = '16px "Segoe UI", sans-serif'; ctx.fillText('Убить Босса на 5-м уровне.', 150, 160);
        ctx.beginPath(); ctx.moveTo(60, 180); ctx.lineTo(440, 180); ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px "Segoe UI", sans-serif'; ctx.fillText('КАРТЫ:', 60, 210);
        const cards = [ rewardPool[1], rewardPool[0], rewardPool[3], rewardPool[2], rewardPool[4] ];

        let cardY = 240;
        cards.forEach(c => {
          ctx.fillStyle = c.color || '#fff'; ctx.fillRect(60, cardY - 12, 24, 24);
          ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(60, cardY - 12, 24, 24);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Segoe UI", sans-serif'; ctx.fillText(c.name, 95, cardY);
          ctx.fillStyle = '#ccc'; ctx.font = '14px "Segoe UI", sans-serif'; ctx.fillText('— ' + (c.type === 'heal' ? 'Лечение' : 'Атака/Движение'), 160, cardY);
          cardY += 35;
        });

        ctx.beginPath(); ctx.moveTo(60, 430); ctx.lineTo(440, 430); ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px "Segoe UI", sans-serif'; ctx.fillText('ПРАВИЛА:', 60, 460);
        ctx.fillStyle = '#ccc'; ctx.font = '15px "Segoe UI", sans-serif';
        ctx.fillText('• Энергия (3/3) восстанавливается каждый ход.', 60, 495);
        ctx.fillText('• Нажми "ЗАКОНЧИТЬ ХОД", когда энергия кончится.', 60, 520);
        ctx.fillText('• После победы выбери 1 из 3 новых карт.', 60, 545);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.fillText('• Будь осторожен на 5-м уровне!', 60, 580);

        drawButton(150, 680, 200, 50, 'НАЗАД', true);
        requestAnimationFrame(gameLoop); return;
      }

      if (gameState === 'EXIT') {
        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('СПАСИБО ЗА ИГРУ!', canvas.width / 2, canvas.height / 2 - 50);
        ctx.fillStyle = '#aaa'; ctx.font = '20px sans-serif'; ctx.fillText('Можете закрыть эту вкладку.', canvas.width / 2, canvas.height / 2 + 20);
        drawButton(150, 680, 200, 50, 'ВЕРНУТЬСЯ', true);
        requestAnimationFrame(gameLoop); return;
      }

      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, OFFSET_Y);
        ctx.fillStyle = '#eee'; ctx.font = 'bold 20px sans-serif'; ctx.textBaseline = 'middle';
        
        ctx.textAlign = 'left';
        if (isBoss) { ctx.fillStyle = '#e74c3c'; ctx.fillText('БОСС!', 20, 30); } 
        else { ctx.fillStyle = '#eee'; ctx.fillText('Уровень: ' + level, 20, 30); }

        ctx.fillStyle = '#4a9c6a'; ctx.textAlign = 'left'; ctx.fillText('HP: ' + hero.hp + '/' + hero.maxHp, 150, 30);
        ctx.fillStyle = '#f1c40f'; ctx.textAlign = 'right'; ctx.fillText('Энергия: ' + energy + '/' + maxEnergy, 380, 30);

        ctx.fillStyle = '#333'; ctx.fillRect(400, 10, 80, 30); ctx.strokeStyle = '#555'; ctx.strokeRect(400, 10, 80, 30);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('В МЕНЮ', 440, 25);

        if (!gameOver && !gameWin && !isVictoryTransition && !isRewardScreen) {
          ctx.fillStyle = '#7f8c8d'; ctx.fillRect(150, 60, 200, 35); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(150, 60, 200, 35);
          ctx.fillStyle = 'white'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ЗАКОНЧИТЬ ХОД', 250, 78);
        }
        
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, OFFSET_Y); ctx.lineTo(canvas.width, OFFSET_Y); ctx.stroke();

        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            if (isObstacle(c, r)) {
              ctx.fillStyle = '#1a1a1a'; ctx.fillRect(c * CELL + 5, r * CELL + 5 + OFFSET_Y, CELL - 10, CELL - 10);
              ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.strokeRect(c * CELL + 5, r * CELL + 5 + OFFSET_Y, CELL - 10, CELL - 10);
              ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath();
              ctx.moveTo(c * CELL + 20, r * CELL + 20 + OFFSET_Y); ctx.lineTo(c * CELL + 80, r * CELL + 80 + OFFSET_Y); ctx.stroke();
            } else {
              ctx.fillStyle = '#444'; ctx.fillRect(c * CELL + 2, r * CELL + 2 + OFFSET_Y, CELL - 4, CELL - 4);
              ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(c * CELL, r * CELL + OFFSET_Y, CELL, CELL);
            }
          }
        }

        if (enemy && enemy.hp > 0) drawEntity(enemy, isBoss);
        if (hero && hero.hp > 0) drawEntity(hero, false);

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          let ft = floatingTexts[i]; ft.yOffset -= 1.5; ft.alpha -= 0.03;
          if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
          ctx.globalAlpha = ft.alpha; ctx.fillStyle = ft.color; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(ft.text, ft.col * CELL + CELL / 2, ft.row * CELL + CELL / 2 + OFFSET_Y + ft.yOffset);
          ctx.globalAlpha = 1; 
        }

               // ОТРИСОВКА РУКИ
        cardPositions = [];
        if (!gameOver && !gameWin && !isVictoryTransition && !isRewardScreen) {
          let numCards = hand.length; 
          
          let cardW = 90;
          let cardH = 130;
          let spacing = 100; 
          
          let totalWidth = (numCards - 1) * spacing + cardW; 
          let startX = (canvas.width - totalWidth) / 2;
          
          for (let i = 0; i < numCards; i++) {
            let x = startX + i * spacing; 
            let y = 615; // Опустили ровно под игровое поле
            let drawY = (i === selectedCardIndex) ? y - 10 : y; 
            
            cardPositions.push({x: x, y: drawY, w: cardW, h: cardH});
            drawCardUI(x, drawY, hand[i], i === selectedCardIndex, cardW, cardH);
          }
          
          // Сдвинули текст колоды в самый низ, чтобы карты его не перекрывали
          ctx.fillStyle = '#aaa'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left'; 
          ctx.fillText('Колода: ' + deck.length, 20, 755);
          ctx.textAlign = 'right'; 
          ctx.fillText('Сброс: ' + discardPile.length, 480, 755);
        }

        // ОТРИСОВКА ЭКРАНА НАГРАД
        if (isRewardScreen) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('ВЫБЕРИТЕ НАГРАДУ', 250, 200);
          
          for (let i = 0; i < 3; i++) {
              let cx = 55 + i * 135;
              let cy = 250;
              drawCardUI(cx, cy, rewardCards[i], false);
          }
        }

        if (isEnemyTurn && !gameOver && !gameWin) {
          ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Ход врага...', 250, 600);
        }

        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 30; ctx.fillStyle = '#e74c3c'; ctx.font = '900 50px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillText('ВЫ ПОГИБЛИ', 250, 300);
          ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('Достигнут уровень: ' + level, 250, 360);
          ctx.fillStyle = '#aaa'; ctx.font = '18px sans-serif'; ctx.fillText('Нажмите, чтобы сыграть еще раз', 250, 420);
        }

        if (gameWin) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 40; ctx.fillStyle = '#f1c40f'; ctx.font = '900 50px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillText('ВЫ ПОБЕДИЛИ!', 250, 300);
          ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif';
          ctx.fillText('Босс повержен.', 250, 360); ctx.fillText('Вы зачистили подземелье!', 250, 390);
          ctx.fillStyle = '#aaa'; ctx.font = '18px sans-serif'; ctx.fillText('Нажмите, чтобы начать заново', 250, 450);
        }

        requestAnimationFrame(gameLoop); return;
      }
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
